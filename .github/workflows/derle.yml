name: Uygulamayı derle

# Elle çalıştırılabilir; "s1.0" gibi bir etiket gönderilince sürüm de oluşturur.
on:
  workflow_dispatch:
  push:
    tags: ["s*"]

permissions:
  contents: write

jobs:
  derle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows runner bu hesapta alınamıyor — iş 6 saat kuyrukta bekleyip
          # iptal ediliyor. Exe elle derleniyor: derle-windows.bat +
          # WINDOWS-DERLEME.txt. Runner çalışır hâle gelirse satırı geri açın;
          # aşağıdaki Windows adımları yerinde duruyor.
          # - isletim: windows-2022
          #   ad: Windows
          #   paket: UDF-Imza-Birlestirici-Windows.zip
          - isletim: macos-latest
            ad: macOS-AppleSilicon
            paket: UDF-Imza-Birlestirici-macOS-AppleSilicon.zip
          # macos-13 emekli oldu; Intel paketi macos-15-intel ile üretiliyor.
          - isletim: macos-15-intel
            ad: macOS-Intel
            paket: UDF-Imza-Birlestirici-macOS-Intel.zip

    runs-on: ${{ matrix.isletim }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"

      # macOS'un sistem Tcl/Tk 8.5'i pencereyi BOŞ çizer; 8.6+ şart.
      # Runner'da kurulu Python'lar taranır, uygun Tk'lı olan seçilir; hiçbiri
      # uymazsa Homebrew'dan kurulur. (Intel runner'da python.org sürümü
      # /usr/local'ı tuttuğu için "brew link" başarısız oluyor — sorun değil,
      # formül yine kurulur ve tam yolla çağrılır.)
      # Homebrew Python'a doğrudan pip install yapılamaz (PEP 668); bu yüzden
      # sanal ortam kurulup PATH'in başına alınır.
      - name: macOS — güncel Tk'li Python
        if: runner.os == 'macOS'
        run: |
          sec=""
          adaylar=$(ls -d /Library/Frameworks/Python.framework/Versions/3.*/bin/python3 2>/dev/null || true)
          for py in $adaylar; do
            v=$("$py" -c "import tkinter;print(tkinter.TkVersion)" 2>/dev/null) || continue
            if [ "$(printf '%s\n8.6' "$v" | sort -g | head -1)" = "8.6" ]; then
              sec="$py"; break
            fi
          done
          if [ -z "$sec" ]; then
            brew install python-tk@3.13 || true
            sec="$(brew --prefix python@3.13)/bin/python3.13"
          fi
          echo "seçilen Python: $sec  (Tcl/Tk $("$sec" -c 'import tkinter;print(tkinter.TkVersion)'))"
          "$sec" -m venv /tmp/derleme
          echo "/tmp/derleme/bin" >> "$GITHUB_PATH"

      - name: PyInstaller kur
        run: python -m pip install --upgrade pip pyinstaller tkinterdnd2

      - name: Tcl/Tk sürümünü göster
        run: python -c "import tkinter; print('Tcl/Tk', tkinter.TkVersion)"

      - name: Windows — tek dosya exe
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "UDF Imza Birlestirici" --icon ikon/uygulama.ico
          --version-file surum_bilgisi.txt
          --collect-all tkinterdnd2
          --add-data "cms_imza.py;." --add-data "imza_dogrula.py;."
          --add-data "udf_ortak.py;." --add-data "birlestirici.py;."
          --hidden-import cms_imza --hidden-import imza_dogrula
          --hidden-import udf_ortak --hidden-import birlestirici
          uygulama.py

      - name: macOS — uygulama paketi
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name "UDF Imza Birlestirici" --icon ikon/uygulama.icns
          --collect-all tkinterdnd2
          --osx-bundle-identifier "tr.arabuluculuk.udfimza"
          --add-data "cms_imza.py:." --add-data "imza_dogrula.py:."
          --add-data "udf_ortak.py:." --add-data "birlestirici.py:."
          --hidden-import cms_imza --hidden-import imza_dogrula
          --hidden-import udf_ortak --hidden-import birlestirici
          uygulama.py

      - name: macOS — sürüm bilgisini göm
        if: runner.os == 'macOS'
        run: python plist_yaz.py

      # Derlenen uygulama gerçekten çalışıyor mu? Kendi sınamasını koştur.
      # --windowed derlenen exe'nin KONSOLU YOKTUR; çıktı boruya değil dosyaya
      # yazdırılır ve süreç bitene kadar beklenir.
      - name: Sınama (Windows)
        if: runner.os == 'Windows'
        run: |
          Start-Process -FilePath "dist\UDF Imza Birlestirici.exe" `
            -ArgumentList "--sinama","--rapor","sinama.txt" -Wait -NoNewWindow
          if (-not (Test-Path sinama.txt)) { throw "uygulama sinama raporu uretmedi" }
          $cikti = Get-Content sinama.txt -Raw
          Write-Host $cikti
          if ($cikti -notmatch "SINAMA TAMAM") { throw "uygulama beklendigi gibi calismadi" }

      - name: Sınama (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/UDF Imza Birlestirici.app/Contents/MacOS/UDF Imza Birlestirici" \
            --sinama --rapor sinama.txt || true
          cat sinama.txt
          grep -q "SINAMA TAMAM" sinama.txt || { echo "uygulama beklendigi gibi calismadi"; exit 1; }

      - name: Paketle (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir paket
          copy "dist\UDF Imza Birlestirici.exe" paket\
          copy KULLANIM.txt paket\ 2>$null
          copy LICENSE paket\ 2>$null
          Compress-Archive -Path paket\* -DestinationPath "${{ matrix.paket }}"

      - name: Paketle (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p paket
          cp -R "dist/UDF Imza Birlestirici.app" paket/
          cp KULLANIM.txt LICENSE paket/ 2>/dev/null || true
          cd paket && zip -qry "../${{ matrix.paket }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ad }}
          path: ${{ matrix.paket }}

      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.paket }}
          body: |
            Kurulum gerekmez. Arşivi açıp uygulamayı çalıştırın.

            **Windows:** SmartScreen uyarısı çıkarsa “Ek bilgi” → “Yine de çalıştır”.
            **macOS:** ilk açılışta uygulamaya sağ tıklayıp “Aç” deyin.

            Uygulama imzalanmamıştır; bu uyarılar bundan kaynaklanır.
            Belgeler bilgisayardan çıkmaz. Birleştirme için internet gerekmez;
            program yalnızca siz “Güncellemeleri kontrol et” dediğinizde
            GitHub'dan son sürüm numarasını sorar.
